<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リワードちゃんに教えてね！🎀</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #FFF5F9; color: #333; padding: 16px; padding-bottom: 100px; }
    .header { text-align: center; padding: 20px 0; }
    .header h1 { font-size: 20px; color: #FF6B9D; }
    .header p { font-size: 13px; color: #999; margin-top: 8px; }
    .section { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .section-title { font-size: 15px; font-weight: bold; color: #FF6B9D; margin-bottom: 12px; border-bottom: 2px solid #FFE0EC; padding-bottom: 8px; }
    .form-row { display: flex; align-items: center; margin-bottom: 10px; gap: 8px; }
    .form-row label { font-size: 14px; flex-shrink: 0; min-width: 80px; }
    .form-row input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    .form-row .unit { font-size: 13px; color: #666; flex-shrink: 0; }
    .checkbox-row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
    .checkbox-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: #FF6B9D; }
    .checkbox-row label { font-size: 14px; flex: 1; }
    .checkbox-row input[type="number"] { width: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .bonus-months { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .bonus-months label { display: flex; align-items: center; gap: 4px; font-size: 13px; }
    .bonus-months input { width: 18px; height: 18px; accent-color: #FF6B9D; }
    .dynamic-table { width: 100%; margin-top: 8px; }
    .dynamic-table .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .dynamic-table .row input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .dynamic-table .row input.amount { width: 80px; flex: none; }
    .dynamic-table .row .delete-btn { width: 30px; height: 30px; border: none; background: #FF6B9D; color: #fff; border-radius: 50%; font-size: 16px; cursor: pointer; }
    .add-btn { display: inline-flex; align-items: center; gap: 4px; padding: 8px 16px; background: #FFE0EC; color: #FF6B9D; border: none; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: bold; }
    .submit-btn { display: block; width: 100%; padding: 16px; background: linear-gradient(135deg, #FF6B9D, #FF8E53); color: #fff; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; position: fixed; bottom: 20px; left: 16px; right: 16px; width: calc(100% - 32px); box-shadow: 0 4px 12px rgba(255,107,157,0.4); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .warning { font-size: 12px; color: #999; text-align: center; margin-top: 12px; }
    .loading { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 1000; justify-content: center; align-items: center; font-size: 18px; color: #FF6B9D; }
    .loading.show { display: flex; }
  </style>
</head>
<body>
  <div class="loading" id="loading">送信中... 🎀</div>

  <div class="header">
    <h1>🎀 リワードちゃんに教えてね！</h1>
    <p>ざっくりで大丈夫だよ〜</p>
  </div>

  <!-- 💰 お給料 -->
  <div class="section">
    <div class="section-title">💰 お給料</div>
    <div class="form-row">
      <label>手取り月収</label>
      <input type="number" id="income" placeholder="25" min="1">
      <span class="unit">万円</span>
    </div>
    <div class="form-row">
      <label>ボーナス</label>
      <input type="number" id="bonus" placeholder="30" min="0">
      <span class="unit">万円/回</span>
    </div>
    <div class="bonus-months">
      <span style="font-size:13px;">ボーナス月:</span>
      <label><input type="checkbox" value="1">1月</label>
      <label><input type="checkbox" value="6" checked>6月</label>
      <label><input type="checkbox" value="7">7月</label>
      <label><input type="checkbox" value="12" checked>12月</label>
    </div>
  </div>

  <!-- 🏠 固定費 -->
  <div class="section">
    <div class="section-title">🏠 固定費</div>
    <div class="checkbox-row"><input type="checkbox" id="fc_rent" checked><label for="fc_rent">家賃・住宅ローン</label><input type="number" id="fc_rent_amt" placeholder="0"> <span class="unit">万円</span></div>
    <div class="checkbox-row"><input type="checkbox" id="fc_phone"><label for="fc_phone">スマホ代</label><input type="number" id="fc_phone_amt" placeholder="0"> <span class="unit">万円</span></div>
    <div class="checkbox-row"><input type="checkbox" id="fc_utility"><label for="fc_utility">光熱費</label><input type="number" id="fc_utility_amt" placeholder="0"> <span class="unit">万円</span></div>
    <div class="checkbox-row"><input type="checkbox" id="fc_insurance"><label for="fc_insurance">保険</label><input type="number" id="fc_insurance_amt" placeholder="0"> <span class="unit">万円</span></div>
    <div class="checkbox-row"><input type="checkbox" id="fc_loan"><label for="fc_loan">奨学金・ローン</label><input type="number" id="fc_loan_amt" placeholder="0"> <span class="unit">万円</span></div>
  </div>

  <!-- サブスク -->
  <div class="section">
    <div class="section-title">📱 サブスク</div>
    <div class="checkbox-row"><input type="checkbox" id="sub_netflix"><label for="sub_netflix">Netflix</label><input type="number" id="sub_netflix_amt" placeholder="790"> <span class="unit">円</span></div>
    <div class="checkbox-row"><input type="checkbox" id="sub_spotify"><label for="sub_spotify">Spotify</label><input type="number" id="sub_spotify_amt" placeholder="980"> <span class="unit">円</span></div>
    <div class="checkbox-row"><input type="checkbox" id="sub_youtube"><label for="sub_youtube">YouTube Premium</label><input type="number" id="sub_youtube_amt" placeholder="1280"> <span class="unit">円</span></div>
    <div class="checkbox-row"><input type="checkbox" id="sub_prime"><label for="sub_prime">Amazon Prime</label><input type="number" id="sub_prime_amt" placeholder="600"> <span class="unit">円</span></div>
    <div class="checkbox-row"><input type="checkbox" id="sub_gym"><label for="sub_gym">ジム</label><input type="number" id="sub_gym_amt" placeholder="0"> <span class="unit">円</span></div>
    <!-- その他固定費 動的テーブル -->
    <div style="margin-top:12px;font-size:13px;color:#666;">その他の固定費:</div>
    <div class="dynamic-table" id="otherFixedTable"></div>
    <button class="add-btn" onclick="addFixedRow()">＋ 追加</button>
  </div>

  <!-- 🎂 記念日 -->
  <div class="section">
    <div class="section-title">🎂 記念日</div>
    <div class="checkbox-row"><input type="checkbox" id="ann_birthday"><label for="ann_birthday">自分の誕生日</label><input type="text" id="ann_birthday_date" placeholder="MM/DD" style="width:80px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px;"></div>
    <div class="checkbox-row"><input type="checkbox" id="ann_partner"><label for="ann_partner">パートナー誕生日</label><input type="text" id="ann_partner_date" placeholder="MM/DD" style="width:80px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px;"></div>
    <div class="checkbox-row"><input type="checkbox" id="ann_wedding"><label for="ann_wedding">結婚記念日</label><input type="text" id="ann_wedding_date" placeholder="MM/DD" style="width:80px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px;"></div>
    <!-- その他記念日 動的テーブル -->
    <div style="margin-top:12px;font-size:13px;color:#666;">その他の記念日:</div>
    <div class="dynamic-table" id="otherAnnTable"></div>
    <button class="add-btn" onclick="addAnnRow()">＋ 追加</button>
  </div>

  <p class="warning">⚠️ テスト中なので金額はざっくりで大丈夫だよ〜</p>

  <button class="submit-btn" id="submitBtn" onclick="submitForm()">✨ 登録する ✨</button>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = '2010106872-9t0gN1D6';
  const API_BASE = 'https://6seky2k0ge.execute-api.ap-northeast-1.amazonaws.com';
  let idToken = null;

  async function initLiff() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      idToken = liff.getIDToken();
      await loadProfile();
    } catch (e) {
      console.error('LIFF init error:', e);
    }
  }
  initLiff();

  // ─── プロフィールを読み込んでフォームに反映 ───
  async function loadProfile() {
    try {
      const headers = {};
      if (idToken) headers['Authorization'] = `Bearer ${idToken}`;
      const res = await fetch(`${API_BASE}/api/settings`, { headers });
      if (!res.ok) return;
      const d = await res.json();

      // まず全チェックボックスをリセット（HTMLデフォルトをクリア）
      ['fc_rent','fc_phone','fc_utility','fc_insurance','fc_loan',
       'sub_netflix','sub_spotify','sub_youtube','sub_prime','sub_gym',
       'ann_birthday','ann_partner','ann_wedding'
      ].forEach(id => { document.getElementById(id).checked = false; });
      document.querySelectorAll('.bonus-months input[type="checkbox"]').forEach(cb => { cb.checked = false; });

      // 月収
      if (d.monthly_income > 0)
        document.getElementById('income').value = Math.round(d.monthly_income / 10000);

      // ボーナス
      if (d.bonus_amount > 0)
        document.getElementById('bonus').value = Math.round(d.bonus_amount / 10000);

      // ボーナス月
      if (d.bonus_months && d.bonus_months.length > 0) {
        document.querySelectorAll('.bonus-months input[type="checkbox"]').forEach(cb => {
          cb.checked = d.bonus_months.includes(parseInt(cb.value));
        });
      }

      // 固定費・サブスク
      const fixedMap = {
        '家賃・住宅ローン': { cb: 'fc_rent',      amt: 'fc_rent_amt',      unit: 10000 },
        'スマホ代':          { cb: 'fc_phone',     amt: 'fc_phone_amt',     unit: 10000 },
        '光熱費':            { cb: 'fc_utility',   amt: 'fc_utility_amt',   unit: 10000 },
        '保険':              { cb: 'fc_insurance', amt: 'fc_insurance_amt', unit: 10000 },
        '奨学金・ローン':    { cb: 'fc_loan',      amt: 'fc_loan_amt',      unit: 10000 },
      };
      const subMap = {
        'Netflix':           { cb: 'sub_netflix', amt: 'sub_netflix_amt',  unit: 1 },
        'Spotify':           { cb: 'sub_spotify', amt: 'sub_spotify_amt',  unit: 1 },
        'YouTube Premium':   { cb: 'sub_youtube', amt: 'sub_youtube_amt',  unit: 1 },
        'Amazon Prime':      { cb: 'sub_prime',   amt: 'sub_prime_amt',    unit: 1 },
        'ジム':              { cb: 'sub_gym',      amt: 'sub_gym_amt',     unit: 1 },
      };
      const otherFixed = [];
      for (const item of (d.fixed_costs || [])) {
        const name = item.name || '';
        const amount = item.amount || 0;
        if (fixedMap[name]) {
          document.getElementById(fixedMap[name].cb).checked = true;
          document.getElementById(fixedMap[name].amt).value = Math.round(amount / fixedMap[name].unit);
        } else if (subMap[name]) {
          document.getElementById(subMap[name].cb).checked = true;
          document.getElementById(subMap[name].amt).value = Math.round(amount / subMap[name].unit);
        } else {
          otherFixed.push({ name, amount });
        }
      }
      for (const item of otherFixed) {
        const table = document.getElementById('otherFixedTable');
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<input type="text" placeholder="項目名" value="${esc(item.name)}"><input type="number" class="amount" placeholder="金額" value="${item.amount}"><span style="font-size:12px">円</span><button class="delete-btn" onclick="this.parentNode.remove()">✕</button>`;
        table.appendChild(row);
      }

      // 記念日
      const annMap = {
        '自分の誕生日':   { cb: 'ann_birthday', date: 'ann_birthday_date' },
        'パートナー誕生日': { cb: 'ann_partner', date: 'ann_partner_date' },
        '結婚記念日':     { cb: 'ann_wedding',  date: 'ann_wedding_date'  },
      };
      const otherAnn = [];
      for (const ann of (d.anniversaries || [])) {
        const name = ann.name || '';
        const dateVal = (ann.date || '').replace('-', '/');
        if (annMap[name]) {
          document.getElementById(annMap[name].cb).checked = true;
          document.getElementById(annMap[name].date).value = dateVal;
        } else {
          otherAnn.push({ name, date: dateVal });
        }
      }
      for (const ann of otherAnn) {
        const table = document.getElementById('otherAnnTable');
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<input type="text" placeholder="記念日名" value="${esc(ann.name)}"><input type="text" class="amount" placeholder="MM/DD" style="width:80px" value="${esc(ann.date)}"><button class="delete-btn" onclick="this.parentNode.remove()">✕</button>`;
        table.appendChild(row);
      }
    } catch (e) {
      console.warn('loadProfile failed:', e);
    }
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function addFixedRow() {
    const table = document.getElementById('otherFixedTable');
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<input type="text" placeholder="項目名"><input type="number" class="amount" placeholder="金額"><span style="font-size:12px">円</span><button class="delete-btn" onclick="this.parentNode.remove()">✕</button>';
    table.appendChild(row);
  }

  function addAnnRow() {
    const table = document.getElementById('otherAnnTable');
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<input type="text" placeholder="記念日名"><input type="text" class="amount" placeholder="MM/DD" style="width:80px"><button class="delete-btn" onclick="this.parentNode.remove()">✕</button>';
    table.appendChild(row);
  }

  function collectFixedCosts() {
    const costs = [];
    const items = [
      { cb: 'fc_rent', amt: 'fc_rent_amt', name: '家賃・住宅ローン', unit: 10000 },
      { cb: 'fc_phone', amt: 'fc_phone_amt', name: 'スマホ代', unit: 10000 },
      { cb: 'fc_utility', amt: 'fc_utility_amt', name: '光熱費', unit: 10000 },
      { cb: 'fc_insurance', amt: 'fc_insurance_amt', name: '保険', unit: 10000 },
      { cb: 'fc_loan', amt: 'fc_loan_amt', name: '奨学金・ローン', unit: 10000 },
    ];
    for (const item of items) {
      if (document.getElementById(item.cb).checked) {
        const val = parseInt(document.getElementById(item.amt).value) || 0;
        if (val > 0) costs.push({ name: item.name, amount: val * item.unit });
      }
    }
    return costs;
  }

  function collectSubscriptions() {
    const subs = [];
    const items = [
      { cb: 'sub_netflix', amt: 'sub_netflix_amt', name: 'Netflix' },
      { cb: 'sub_spotify', amt: 'sub_spotify_amt', name: 'Spotify' },
      { cb: 'sub_youtube', amt: 'sub_youtube_amt', name: 'YouTube Premium' },
      { cb: 'sub_prime', amt: 'sub_prime_amt', name: 'Amazon Prime' },
      { cb: 'sub_gym', amt: 'sub_gym_amt', name: 'ジム' },
    ];
    for (const item of items) {
      if (document.getElementById(item.cb).checked) {
        const val = parseInt(document.getElementById(item.amt).value) || 0;
        if (val > 0) subs.push({ name: item.name, amount: val });
      }
    }
    return subs;
  }

  function collectOtherFixed() {
    const rows = document.querySelectorAll('#otherFixedTable .row');
    const items = [];
    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      const name = inputs[0]?.value?.trim();
      const amount = parseInt(inputs[1]?.value) || 0;
      if (name && amount > 0) items.push({ name, amount });
    });
    return items;
  }

  function collectAnniversaries() {
    const anns = [];
    const items = [
      { cb: 'ann_birthday', date: 'ann_birthday_date', name: '自分の誕生日' },
      { cb: 'ann_partner', date: 'ann_partner_date', name: 'パートナー誕生日' },
      { cb: 'ann_wedding', date: 'ann_wedding_date', name: '結婚記念日' },
    ];
    for (const item of items) {
      if (document.getElementById(item.cb).checked) {
        const dateVal = document.getElementById(item.date).value.trim();
        if (dateVal) anns.push({ name: item.name, date: dateVal.replace('/', '-') });
      }
    }
    // その他
    const rows = document.querySelectorAll('#otherAnnTable .row');
    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      const name = inputs[0]?.value?.trim();
      const dateVal = inputs[1]?.value?.trim();
      if (name && dateVal) anns.push({ name, date: dateVal.replace('/', '-') });
    });
    return anns;
  }

  function collectBonusMonths() {
    const checks = document.querySelectorAll('.bonus-months input[type="checkbox"]:checked');
    return Array.from(checks).map(c => parseInt(c.value));
  }

  async function submitForm() {
    const income = parseInt(document.getElementById('income').value) || 0;
    if (income <= 0) {
      alert('手取り月収を入力してください');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    document.getElementById('loading').classList.add('show');

    const data = {
      monthly_income: income * 10000,
      fixed_costs: collectFixedCosts(),
      subscriptions: collectSubscriptions(),
      other_fixed_costs: collectOtherFixed(),
      bonus_months: collectBonusMonths(),
      bonus_amount: (parseInt(document.getElementById('bonus').value) || 0) * 10000,
      anniversaries: collectAnniversaries(),
    };

    try {
      const headers = { 'Content-Type': 'application/json' };
      if (idToken) headers['Authorization'] = `Bearer ${idToken}`;

      const res = await fetch(`${API_BASE}/api/onboarding`, {
        method: 'POST',
        headers,
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (res.ok && result.success) {
        const budgetMan = Math.floor(result.reward_budget / 10000);
        const budgetSen = Math.floor((result.reward_budget % 10000) / 1000);
        const budgetStr = budgetMan > 0
          ? (budgetSen > 0 ? `${budgetMan}万${budgetSen}千円` : `${budgetMan}万円`)
          : `${result.reward_budget.toLocaleString()}円`;
        document.getElementById('loading').classList.remove('show');
        // 完了メッセージを画面に表示
        document.body.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:#FFF5F9;font-family:-apple-system,sans-serif;">
            <div style="font-size:48px;margin-bottom:16px;">🎀</div>
            <h2 style="color:#FF6B9D;font-size:22px;margin-bottom:12px;">登録完了！</h2>
            <div style="background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 2px 12px rgba(255,107,157,0.15);text-align:center;width:100%;max-width:320px;">
              <div style="font-size:13px;color:#999;margin-bottom:4px;">今月のごほうび枠</div>
              <div style="font-size:36px;font-weight:bold;color:#FF6B9D;">${budgetStr}</div>
              <div style="font-size:13px;color:#666;margin-top:8px;">LINEにもお知らせしたよ✨<br>ごほうびを選びに行こう🍮</div>
            </div>
            <button onclick="if(liff.isInClient()){liff.closeWindow();}else{window.close();}" style="margin-top:24px;padding:14px 32px;background:linear-gradient(135deg,#FF6B9D,#FF8E53);color:#fff;border:none;border-radius:30px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(255,107,157,0.4);">
              閉じる
            </button>
          </div>`;
      } else {
        alert('エラー: ' + (result.error || '送信に失敗しました'));
      }
    } catch (e) {
      alert('通信エラーが発生しました。もう一度お試しください。');
      console.error(e);
    } finally {
      btn.disabled = false;
      document.getElementById('loading').classList.remove('show');
    }
  }
</script>
</body>
</html>
