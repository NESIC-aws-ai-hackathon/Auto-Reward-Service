AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Auto Reward Service \u2014 LINE Bot with AI Reward Suggestions"
Globals:
  Function:
    Runtime: python3.13
    Architectures:
    - x86_64
    Environment:
      Variables:
        TABLE_NAME:
          Ref: ArsTable
        LINE_SECRET_NAME: ars/line
        GOOGLE_SECRET_NAME: ars/google
        RAKUTEN_SECRET_NAME: ars/rakuten
        LOG_LEVEL: INFO
        BEDROCK_TEXT_MODEL_ID: amazon.nova-lite-v1:0
        BEDROCK_IMAGE_MODEL_ID: amazon.nova-lite-v1:0
        BEDROCK_FALLBACK_MODEL_ID: amazon.nova-lite-v1:0
        BEDROCK_INTENT_MODEL_ID: amazon.nova-lite-v1:0
        DAILY_CHAT_LIMIT: '50'
        LIFF_URL: ''
        CART_AUTOMATION_MODE: amazon_url
        ENABLE_REAL_PURCHASE: 'true'
        NOVA_ACT_DEMO_MODE: 'true'
        MAX_PURCHASE_AMOUNT: '5000'
        PUSH_COOLDOWN_HOURS: '1'
        PUSH_SUGGEST_THRESHOLD: '40'
        ENABLE_PWA_WEB_PUSH: 'true'
        ENABLE_LINE_PUSH: 'false'
        VAPID_SECRET_ID: ars/webpush
        ENABLE_NOVA_ACT: 'true'
        ENABLE_NOVA_ACT_SMOKE: 'true'
        NOVA_ACT_SYNC_IN_LINE_CHAT: 'false'
        ENABLE_EXTERNAL_REWARD_API: 'true'
        ENABLE_STATIC_REWARD_FALLBACK: 'true'
        ENABLE_REWARD_POOL_CACHE: 'true'
        ENABLE_LINE_BOT: 'true'
        ENABLE_LINE_RICH_MENU: 'true'
        ENABLE_RECEIPT_ANALYSIS: 'true'
        ENABLE_GOOGLE_CALENDAR: 'false'
    Layers:
    - Ref: ArsCommonLayer
    Tracing: PassThrough
    Tags:
      Project: auto-reward-service
      Stage: prod
Resources:
  ArsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ArsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      - AttributeName: entityType
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: entityType-index
        KeySchema:
        - AttributeName: entityType
          KeyType: HASH
        - AttributeName: PK
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
      - Key: Project
        Value: auto-reward-service
      - Key: Stage
        Value: prod
  ArsCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: ArsCommonLayer
      ContentUri: ..\..\layer.zip
      CompatibleRuntimes:
      - python3.13
      RetentionPolicy: Retain
  ArsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ArsLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
      - PolicyName: ArsDynamoDBPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchWriteItem
            Resource:
            - Fn::GetAtt:
              - ArsTable
              - Arn
            - Fn::Sub: ${ArsTable.Arn}/index/*
      - PolicyName: ArsBedrockPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource: '*'
      - PolicyName: ArsSecretsManagerPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/line*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/google*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/rakuten*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/hotpepper*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/webpush*
      - PolicyName: ArsSQSPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - ReceiptProcessingQueue
              - Arn
  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
        - https://liff.line.me
        - '*'
        AllowMethods:
        - GET
        - PUT
        - POST
        - OPTIONS
        AllowHeaders:
        - Authorization
        - Content-Type
        MaxAge: 86400
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      Tags:
        Project: auto-reward-service
        Stage: prod
  ReceiptProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: ${AWS::StackName}-receipt-queue
      VisibilityTimeout: 60
      MessageRetentionPeriod: 3600
      Tags:
      - Key: Project
        Value: auto-reward-service
  WebhookHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: WebhookHandlerFunction
      Handler: handlers.webhook_handler.handler
      CodeUri: WebhookHandlerFunction
      MemorySize: 256
      Timeout: 29
      Role:
        Fn::GetAtt:
        - ArsLambdaRole
        - Arn
      Environment:
        Variables:
          RECEIPT_QUEUE_URL:
            Ref: ReceiptProcessingQueue
          USE_MOCK_LOCATION: 'false'
          HOTPEPPER_SECRET_NAME: ars/hotpepper/api-key
      Events:
        WebhookPost:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /webhook
            Method: POST
      Tags:
        Project: auto-reward-service
        Stage: prod
    Metadata:
      SamResourceId: WebhookHandlerFunction
  WebhookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${WebhookHandlerFunction}
      RetentionInDays: 30
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ArsSchedulerExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: InvokeLambdaPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
            - Fn::GetAtt:
              - WebhookHandlerFunction
              - Arn
            - Fn::GetAtt:
              - RewardPoolUpdaterFunction
              - Arn
            - Fn::GetAtt:
              - ReceiptProcessorFunction
              - Arn
            - Fn::GetAtt:
              - PwaTemptationFunction
              - Arn
            - Fn::GetAtt:
              - ScheduledPushFunction
              - Arn
  WarmupWebhookScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: WarmupWebhookScheduler
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn:
          Fn::GetAtt:
          - WebhookHandlerFunction
          - Arn
        RoleArn:
          Fn::GetAtt:
          - SchedulerExecutionRole
          - Arn
        Input: '{"source": "warmup"}'
  ReceiptProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ReceiptProcessorFunction
      Handler: handlers.receipt_processor_handler.handler
      CodeUri: ReceiptProcessorFunction
      MemorySize: 512
      Timeout: 60
      Role:
        Fn::GetAtt:
        - ArsLambdaRole
        - Arn
      Events:
        ReceiptQueue:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - ReceiptProcessingQueue
              - Arn
            BatchSize: 1
      Tags:
        Project: auto-reward-service
        Stage: prod
    Metadata:
      SamResourceId: ReceiptProcessorFunction
  ReceiptProcessorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ReceiptProcessorFunction}
      RetentionInDays: 30
  RewardPoolUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RewardPoolUpdaterFunction
      Handler: handlers.reward_pool_updater.lambda_handler
      CodeUri: RewardPoolUpdaterFunction
      MemorySize: 256
      Timeout: 300
      Role:
        Fn::GetAtt:
        - ArsLambdaRole
        - Arn
      VpcConfig:
        SubnetIds:
        - subnet-05abb8037eca46a32
        - subnet-0dfb67c2b0be42f60
        - subnet-0dfdde586a91d0dc7
        SecurityGroupIds:
        - sg-070161197823ac4d3
      Environment:
        Variables:
          RAKUTEN_DEFAULT_KEYWORDS: "\u30B9\u30A4\u30FC\u30C4,\u30B3\u30B9\u30E1,\u672C\
            ,\u5165\u6D74\u5264,\u30A2\u30ED\u30DE"
          RAKUTEN_MAX_ITEMS_PER_POOL: '20'
          RAKUTEN_HITS_PER_KEYWORD: '5'
          HOTPEPPER_SECRET_NAME: ars/hotpepper/api-key
          ENABLE_HOTEL_SEARCH: 'true'
          HOTEL_HITS_PER_KEYWORD: '3'
          ENABLE_RESTAURANT_SEARCH: 'true'
          RESTAURANT_HITS_PER_KEYWORD: '3'
      Tags:
        Project: auto-reward-service
        Stage: prod
    Metadata:
      SamResourceId: RewardPoolUpdaterFunction
  RewardPoolUpdaterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${RewardPoolUpdaterFunction}
      RetentionInDays: 30
  RewardPoolScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: RewardPoolScheduler
      ScheduleExpression: cron(0 17 * * ? *)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn:
          Fn::GetAtt:
          - RewardPoolUpdaterFunction
          - Arn
        RoleArn:
          Fn::GetAtt:
          - SchedulerExecutionRole
          - Arn
        Input: '{"source": "scheduler"}'
  ScheduledPushFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ScheduledPushFunction
      Handler: handlers.scheduled_push.handler
      CodeUri: ScheduledPushFunction
      MemorySize: 256
      Timeout: 60
      Role:
        Fn::GetAtt:
        - ArsLambdaRole
        - Arn
      Environment:
        Variables:
          DAILY_PUSH_LIMIT: '2'
      Tags:
        Project: auto-reward-service
        Stage: prod
    Metadata:
      SamResourceId: ScheduledPushFunction
  ScheduledPushFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ScheduledPushFunction}
      RetentionInDays: 14
  ScheduledPushEvening:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ScheduledPushEvening
      ScheduleExpression: cron(0 9 * * ? *)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn:
          Fn::GetAtt:
          - ScheduledPushFunction
          - Arn
        RoleArn:
          Fn::GetAtt:
          - SchedulerExecutionRole
          - Arn
        Input: '{"source": "scheduler", "slot": "evening"}'
  ScheduledPushNight:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ScheduledPushNight
      ScheduleExpression: cron(0 12 * * ? *)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn:
          Fn::GetAtt:
          - ScheduledPushFunction
          - Arn
        RoleArn:
          Fn::GetAtt:
          - SchedulerExecutionRole
          - Arn
        Input: '{"source": "scheduler", "slot": "night"}'
  PwaTemptationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: PwaTemptationFunction
      Handler: handlers.pwa_temptation.handler
      CodeUri: PwaTemptationFunction
      MemorySize: 512
      Timeout: 30
      Role:
        Fn::GetAtt:
        - ArsLambdaRole
        - Arn
      Environment:
        Variables:
          USE_MOCK_LOCATION: 'false'
          HOTPEPPER_SECRET_NAME: ars/hotpepper/api-key
          PWA_ORIGIN: https://liff.line.me
      Events:
        StartTemptation:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /api/temptation/start
            Method: POST
        AcceptTemptation:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /api/temptation/accept
            Method: POST
        TemptationHistory:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /api/temptation/history
            Method: GET
        CompleteTemptation:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /api/temptation/complete
            Method: POST
        GeocodeTemptation:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /api/temptation/geocode
            Method: POST
      Tags:
        Project: auto-reward-service
        Stage: prod
    Metadata:
      SamResourceId: PwaTemptationFunction
  PwaTemptationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${PwaTemptationFunction}
      RetentionInDays: 30
  LiffApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LiffApiFunction
      Handler: handlers.liff_api.handler
      CodeUri: LiffApiFunction
      MemorySize: 256
      Timeout: 30
      Role:
        Fn::GetAtt:
        - ArsLambdaRole
        - Arn
      Environment:
        Variables:
          LIFF_CHANNEL_ID: '2010106872'
          USE_MOCK_LOCATION: 'false'
          HOTPEPPER_SECRET_NAME: ars/hotpepper/api-key
      Events:
        LiffApiProxy:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /api/{proxy+}
            Method: ANY
        LiffPage:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /liff
            Method: GET
        LiffOnboarding:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /liff/onboarding
            Method: GET
        LiffTemptation:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /liff/temptation
            Method: GET
        LiffAmazonLogin:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /liff/amazon-login
            Method: GET
        PwaServiceWorker:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /service-worker.js
            Method: GET
        PwaManifest:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /manifest.json
            Method: GET
        CalendarCallback:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /api/calendar/callback
            Method: GET
      Tags:
        Project: auto-reward-service
        Stage: prod
    Metadata:
      SamResourceId: LiffApiFunction
  LiffApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${LiffApiFunction}
      RetentionInDays: 30
Outputs:
  ArsTableName:
    Description: DynamoDB table name
    Value:
      Ref: ArsTable
  ArsTableArn:
    Description: DynamoDB table ARN
    Value:
      Fn::GetAtt:
      - ArsTable
      - Arn
  ReceiptProcessingQueueArn:
    Description: Receipt Processing SQS Queue ARN
    Value:
      Fn::GetAtt:
      - ReceiptProcessingQueue
      - Arn
  ArsCommonLayerArn:
    Description: Lambda Layer ARN
    Value:
      Ref: ArsCommonLayer
  ArsLambdaRoleArn:
    Description: Lambda execution role ARN
    Value:
      Fn::GetAtt:
      - ArsLambdaRole
      - Arn
  WebhookApiEndpoint:
    Description: LINE Webhook URL (POST /webhook)
    Value:
      Fn::Join:
      - ''
      - - Fn::GetAtt:
          - WebhookApi
          - ApiEndpoint
        - /webhook
  RewardPoolUpdaterFunctionArn:
    Description: Reward pool batch updater Lambda ARN
    Value:
      Fn::GetAtt:
      - RewardPoolUpdaterFunction
      - Arn
  LiffApiEndpoint:
    Description: LIFF Dashboard URL
    Value:
      Fn::Join:
      - ''
      - - Fn::GetAtt:
          - WebhookApi
          - ApiEndpoint
        - /liff
  LiffApiFunctionArn:
    Description: LIFF API Lambda ARN
    Value:
      Fn::GetAtt:
      - LiffApiFunction
      - Arn
  PwaTemptationFunctionArn:
    Description: PWA Temptation API Lambda ARN
    Value:
      Fn::GetAtt:
      - PwaTemptationFunction
      - Arn
