AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Auto Reward Service \u2014 LINE Bot with AI Reward Suggestions"
Globals:
  Function:
    Runtime: python3.13
    Architectures:
    - x86_64
    Environment:
      Variables:
        TABLE_NAME:
          Ref: ArsTable
        LINE_SECRET_NAME: ars/line
        GOOGLE_SECRET_NAME: ars/google
        RAKUTEN_SECRET_NAME: ars/rakuten
        LOG_LEVEL: INFO
        BEDROCK_TEXT_MODEL_ID: amazon.nova-lite-v1:0
        BEDROCK_IMAGE_MODEL_ID: amazon.nova-lite-v1:0
        BEDROCK_FALLBACK_MODEL_ID: amazon.nova-lite-v1:0
        DAILY_CHAT_LIMIT: '50'
    Layers:
    - Ref: ArsCommonLayer
    Tracing: PassThrough
    Tags:
      Project: auto-reward-service
      Stage: prod
Resources:
  ArsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ArsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      - AttributeName: entityType
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: entityType-index
        KeySchema:
        - AttributeName: entityType
          KeyType: HASH
        - AttributeName: PK
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
      - Key: Project
        Value: auto-reward-service
      - Key: Stage
        Value: prod
  ArsCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: ArsCommonLayer
      ContentUri: ..\..\layer
      CompatibleRuntimes:
      - python3.13
      RetentionPolicy: Retain
  ArsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ArsLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: ArsDynamoDBPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchWriteItem
            Resource:
            - Fn::GetAtt:
              - ArsTable
              - Arn
            - Fn::Sub: ${ArsTable.Arn}/index/*
      - PolicyName: ArsBedrockPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - bedrock:InvokeModel
            Resource: '*'
      - PolicyName: ArsSecretsManagerPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/line*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/google*
            - Fn::Sub: arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/rakuten*
  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
        - https://liff.line.me
        AllowMethods:
        - GET
        - PUT
        - POST
        - OPTIONS
        AllowHeaders:
        - Authorization
        - Content-Type
        MaxAge: 86400
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      Tags:
        Project: auto-reward-service
        Stage: prod
  WebhookHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: WebhookHandlerFunction
      Handler: handlers.webhook_handler.handler
      CodeUri: WebhookHandlerFunction
      MemorySize: 256
      Timeout: 29
      Role:
        Fn::GetAtt:
        - ArsLambdaRole
        - Arn
      Events:
        WebhookPost:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /webhook
            Method: POST
      Tags:
        Project: auto-reward-service
        Stage: prod
    Metadata:
      SamResourceId: WebhookHandlerFunction
  WebhookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${WebhookHandlerFunction}
      RetentionInDays: 30
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ArsSchedulerExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: InvokeLambdaPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
            - Fn::GetAtt:
              - WebhookHandlerFunction
              - Arn
            - Fn::GetAtt:
              - RewardPoolUpdaterFunction
              - Arn
  WarmupWebhookScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: WarmupWebhookScheduler
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn:
          Fn::GetAtt:
          - WebhookHandlerFunction
          - Arn
        RoleArn:
          Fn::GetAtt:
          - SchedulerExecutionRole
          - Arn
        Input: '{"source": "warmup"}'
  RewardPoolUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RewardPoolUpdaterFunction
      Handler: handlers.reward_pool_updater.lambda_handler
      CodeUri: RewardPoolUpdaterFunction
      MemorySize: 256
      Timeout: 300
      Role:
        Fn::GetAtt:
        - ArsLambdaRole
        - Arn
      Environment:
        Variables:
          RAKUTEN_DEFAULT_KEYWORDS: "\u30B9\u30A4\u30FC\u30C4,\u30B3\u30B9\u30E1,\u672C\
            ,\u5165\u6D74\u5264,\u30A2\u30ED\u30DE"
          RAKUTEN_MAX_ITEMS_PER_POOL: '20'
          RAKUTEN_HITS_PER_KEYWORD: '5'
          HOTPEPPER_SECRET_NAME: ars/hotpepper/api-key
          ENABLE_HOTEL_SEARCH: 'true'
          HOTEL_HITS_PER_KEYWORD: '3'
          ENABLE_RESTAURANT_SEARCH: 'false'
          RESTAURANT_HITS_PER_KEYWORD: '3'
      Tags:
        Project: auto-reward-service
        Stage: prod
    Metadata:
      SamResourceId: RewardPoolUpdaterFunction
  RewardPoolUpdaterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${RewardPoolUpdaterFunction}
      RetentionInDays: 30
  RewardPoolScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: RewardPoolScheduler
      ScheduleExpression: cron(0 17 * * ? *)
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn:
          Fn::GetAtt:
          - RewardPoolUpdaterFunction
          - Arn
        RoleArn:
          Fn::GetAtt:
          - SchedulerExecutionRole
          - Arn
        Input: '{"source": "scheduler"}'
  LiffApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LiffApiFunction
      Handler: handlers.liff_api.handler
      CodeUri: LiffApiFunction
      MemorySize: 256
      Timeout: 10
      Role:
        Fn::GetAtt:
        - ArsLambdaRole
        - Arn
      Environment:
        Variables:
          LIFF_CHANNEL_ID: '2010106872'
      Events:
        LiffApiProxy:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /api/{proxy+}
            Method: ANY
        LiffPage:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: WebhookApi
            Path: /liff
            Method: GET
      Tags:
        Project: auto-reward-service
        Stage: prod
    Metadata:
      SamResourceId: LiffApiFunction
  LiffApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${LiffApiFunction}
      RetentionInDays: 30
Outputs:
  ArsTableName:
    Description: DynamoDB table name
    Value:
      Ref: ArsTable
  ArsTableArn:
    Description: DynamoDB table ARN
    Value:
      Fn::GetAtt:
      - ArsTable
      - Arn
  ArsCommonLayerArn:
    Description: Lambda Layer ARN
    Value:
      Ref: ArsCommonLayer
  ArsLambdaRoleArn:
    Description: Lambda execution role ARN
    Value:
      Fn::GetAtt:
      - ArsLambdaRole
      - Arn
  WebhookApiEndpoint:
    Description: LINE Webhook URL (POST /webhook)
    Value:
      Fn::Join:
      - ''
      - - Fn::GetAtt:
          - WebhookApi
          - ApiEndpoint
        - /webhook
  RewardPoolUpdaterFunctionArn:
    Description: Reward pool batch updater Lambda ARN
    Value:
      Fn::GetAtt:
      - RewardPoolUpdaterFunction
      - Arn
  LiffApiEndpoint:
    Description: LIFF Dashboard URL
    Value:
      Fn::Join:
      - ''
      - - Fn::GetAtt:
          - WebhookApi
          - ApiEndpoint
        - /liff
  LiffApiFunctionArn:
    Description: LIFF API Lambda ARN
    Value:
      Fn::GetAtt:
      - LiffApiFunction
      - Arn
