AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Auto Reward Service — LINE Bot with AI Reward Suggestions

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref ArsTable
        LINE_SECRET_NAME: ars/line
        GOOGLE_SECRET_NAME: ars/google
        RAKUTEN_SECRET_NAME: ars/rakuten
        LOG_LEVEL: INFO
        BEDROCK_TEXT_MODEL_ID: "amazon.nova-lite-v1:0"
        BEDROCK_IMAGE_MODEL_ID: "amazon.nova-lite-v1:0"
        BEDROCK_FALLBACK_MODEL_ID: "amazon.nova-lite-v1:0"
        BEDROCK_INTENT_MODEL_ID: "amazon.nova-lite-v1:0"
        DAILY_CHAT_LIMIT: "50"
        LIFF_URL: ""
        # カート搬送 / Nova Act 設定 (変更依頼書_2 §8, §14)
        CART_AUTOMATION_MODE: "amazon_url"
        ENABLE_REAL_PURCHASE: "true"
        NOVA_ACT_DEMO_MODE: "true"
        MAX_PURCHASE_AMOUNT: "5000"
        # PWA通知頻度設定
        PUSH_COOLDOWN_HOURS: "1"
        PUSH_SUGGEST_THRESHOLD: "40"
        # 要件整理.md §7 PWA Web Push (LINE PUSH は廃止、PWA へ移行)
        ENABLE_PWA_WEB_PUSH: "true"
        ENABLE_LINE_PUSH: "false"
        VAPID_SECRET_ID: "ars/webpush"
        # 要件整理.md §10 Nova Act
        ENABLE_NOVA_ACT: "true"
        ENABLE_NOVA_ACT_SMOKE: "true"
        NOVA_ACT_SYNC_IN_LINE_CHAT: "false"
        # 要件整理.md §9 外部 API
        ENABLE_EXTERNAL_REWARD_API: "true"
        ENABLE_STATIC_REWARD_FALLBACK: "true"
        ENABLE_REWARD_POOL_CACHE: "true"
        # 要件整理.md §13 LINE Bot 中心動作
        ENABLE_LINE_BOT: "true"
        ENABLE_LINE_RICH_MENU: "true"
        ENABLE_RECEIPT_ANALYSIS: "true"
        ENABLE_GOOGLE_CALENDAR: "false"
    Layers:
      - !Ref ArsCommonLayer
    Tracing: PassThrough
    Tags:
      Project: auto-reward-service
      Stage: prod

Resources:

  # ─────────────────────────────────────────
  # DynamoDB
  # ─────────────────────────────────────────
  ArsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ArsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: entityType
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: entityType-index
          KeySchema:
            - AttributeName: entityType
              KeyType: HASH
            - AttributeName: PK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: auto-reward-service
        - Key: Stage
          Value: prod

  # ─────────────────────────────────────────
  # Lambda Layer
  # ─────────────────────────────────────────
  ArsCommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: ArsCommonLayer
      ContentUri: layer.zip
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Retain

  # ─────────────────────────────────────────
  # IAM Role（全 Lambda 共有）
  # ─────────────────────────────────────────
  ArsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ArsLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ArsDynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ArsTable.Arn
                  - !Sub "${ArsTable.Arn}/index/*"
        - PolicyName: ArsBedrockPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
        - PolicyName: ArsSecretsManagerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/line*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/google*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/rakuten*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/hotpepper*"
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ars/webpush*"
        - PolicyName: ArsSQSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReceiptProcessingQueue.Arn

  # ─────────────────────────────────────────
  # Lambda Functions（Unit 1〜7 で追加予定）
  # ─────────────────────────────────────────
  # CharacterReply  — Unit 2
  # ImageAnalysis   — Unit 3
  # BatchProcessor  — Unit 5/6
  # LiffApi         — Unit 7

  # ─────────────────────────────────────────
  # API Gateway（Unit 1）
  # ─────────────────────────────────────────
  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "https://liff.line.me"
          - "*"
        AllowMethods:
          - GET
          - PUT
          - POST
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 86400
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      Tags:
        Project: auto-reward-service
        Stage: prod

  # ─────────────────────────────────────────
  # SQS（Unit 3 レシート非同期）
  # ─────────────────────────────────────────
  ReceiptProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-receipt-queue"
      VisibilityTimeout: 60
      MessageRetentionPeriod: 3600
      Tags:
        - Key: Project
          Value: auto-reward-service

  # ─────────────────────────────────────────
  # Lambda Functions（Unit 1）
  # ─────────────────────────────────────────
  WebhookHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: WebhookHandlerFunction
      Handler: handlers.webhook_handler.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 29
      Role: !GetAtt ArsLambdaRole.Arn
      Environment:
        Variables:
          RECEIPT_QUEUE_URL: !Ref ReceiptProcessingQueue
          USE_MOCK_LOCATION: "false"
          HOTPEPPER_SECRET_NAME: "ars/hotpepper/api-key"
      Events:
        WebhookPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook
            Method: POST
      Tags:
        Project: auto-reward-service
        Stage: prod

  # ─────────────────────────────────────────
  # CloudWatch Logs（Unit 1）
  # ─────────────────────────────────────────
  WebhookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WebhookHandlerFunction}"
      RetentionInDays: 30

  # ─────────────────────────────────────────
  # EventBridge Scheduler（Unit 1 ウォームアップ）
  # ─────────────────────────────────────────
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ArsSchedulerExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt WebhookHandlerFunction.Arn
                  - !GetAtt RewardPoolUpdaterFunction.Arn
                  - !GetAtt ReceiptProcessorFunction.Arn
                  - !GetAtt PwaTemptationFunction.Arn
                  - !GetAtt ScheduledPushFunction.Arn

  WarmupWebhookScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: WarmupWebhookScheduler
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt WebhookHandlerFunction.Arn
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: '{"source": "warmup"}'

  # ─────────────────────────────────────────
  # Lambda Functions（Unit 3 SQS レシート非同期処理）
  # ─────────────────────────────────────────
  ReceiptProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ReceiptProcessorFunction
      Handler: handlers.receipt_processor_handler.handler
      CodeUri: src/
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt ArsLambdaRole.Arn
      Events:
        ReceiptQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt ReceiptProcessingQueue.Arn
            BatchSize: 1
      Tags:
        Project: auto-reward-service
        Stage: prod

  ReceiptProcessorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ReceiptProcessorFunction}"
      RetentionInDays: 30

  # ─────────────────────────────────────────
  # Lambda Functions（Unit 4）
  # ─────────────────────────────────────────
  RewardPoolUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RewardPoolUpdaterFunction
      Handler: handlers.reward_pool_updater.lambda_handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 300
      Role: !GetAtt ArsLambdaRole.Arn
      VpcConfig:
        SubnetIds:
          - subnet-05abb8037eca46a32  # private1 ap-northeast-1a
          - subnet-0dfb67c2b0be42f60  # private2 ap-northeast-1c
          - subnet-0dfdde586a91d0dc7  # private3 ap-northeast-1d
        SecurityGroupIds:
          - sg-070161197823ac4d3  # lambda-basic-sahred
      Environment:
        Variables:
          RAKUTEN_DEFAULT_KEYWORDS: "スイーツ,コスメ,本,入浴剤,アロマ"
          RAKUTEN_MAX_ITEMS_PER_POOL: "20"
          RAKUTEN_HITS_PER_KEYWORD: "5"
          HOTPEPPER_SECRET_NAME: "ars/hotpepper/api-key"
          ENABLE_HOTEL_SEARCH: "true"
          HOTEL_HITS_PER_KEYWORD: "3"
          ENABLE_RESTAURANT_SEARCH: "true"
          RESTAURANT_HITS_PER_KEYWORD: "3"
      Tags:
        Project: auto-reward-service
        Stage: prod

  # ─────────────────────────────────────────
  # CloudWatch Logs（Unit 4）
  # ─────────────────────────────────────────
  RewardPoolUpdaterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RewardPoolUpdaterFunction}"
      RetentionInDays: 30

  # ─────────────────────────────────────────
  # EventBridge Scheduler（Unit 4 日次バッチ JST 02:00）
  # ─────────────────────────────────────────
  RewardPoolScheduler:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: RewardPoolScheduler
      ScheduleExpression: "cron(0 17 * * ? *)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt RewardPoolUpdaterFunction.Arn
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: '{"source": "scheduler"}'

  # ─────────────────────────────────────────
  # Lambda Functions（定期 Push 通知）
  # ─────────────────────────────────────────
  ScheduledPushFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ScheduledPushFunction
      Handler: handlers.scheduled_push.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt ArsLambdaRole.Arn
      Environment:
        Variables:
          DAILY_PUSH_LIMIT: "2"
      Tags:
        Project: auto-reward-service
        Stage: prod

  ScheduledPushFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ScheduledPushFunction}"
      RetentionInDays: 14

  # 18:00 JST = 09:00 UTC
  ScheduledPushEvening:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ScheduledPushEvening
      ScheduleExpression: "cron(0 9 * * ? *)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ScheduledPushFunction.Arn
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: '{"source": "scheduler", "slot": "evening"}'

  # 21:00 JST = 12:00 UTC
  ScheduledPushNight:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ScheduledPushNight
      ScheduleExpression: "cron(0 12 * * ? *)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ScheduledPushFunction.Arn
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: '{"source": "scheduler", "slot": "night"}'

  # ─────────────────────────────────────────
  # Lambda Functions（PWA 寄り道レーン API）
  # ─────────────────────────────────────────
  PwaTemptationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: PwaTemptationFunction
      Handler: handlers.pwa_temptation.handler
      CodeUri: src/
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ArsLambdaRole.Arn
      Environment:
        Variables:
          USE_MOCK_LOCATION: "false"
          HOTPEPPER_SECRET_NAME: "ars/hotpepper/api-key"
          PWA_ORIGIN: "https://liff.line.me"
      Events:
        StartTemptation:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /api/temptation/start
            Method: POST
        AcceptTemptation:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /api/temptation/accept
            Method: POST
        TemptationHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /api/temptation/history
            Method: GET
        CompleteTemptation:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /api/temptation/complete
            Method: POST
        GeocodeTemptation:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /api/temptation/geocode
            Method: POST
      Tags:
        Project: auto-reward-service
        Stage: prod

  PwaTemptationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PwaTemptationFunction}"
      RetentionInDays: 30

  # ─────────────────────────────────────────
  # Lambda Functions（Unit 7）
  # ─────────────────────────────────────────
  LiffApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LiffApiFunction
      Handler: handlers.liff_api.handler
      CodeUri: src/
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt ArsLambdaRole.Arn
      Environment:
        Variables:
          LIFF_CHANNEL_ID: "2010106872"
          USE_MOCK_LOCATION: "false"
          HOTPEPPER_SECRET_NAME: "ars/hotpepper/api-key"
      Events:
        LiffApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /api/{proxy+}
            Method: ANY
        LiffPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /liff
            Method: GET
        LiffOnboarding:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /liff/onboarding
            Method: GET
        LiffTemptation:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /liff/temptation
            Method: GET
        LiffAmazonLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /liff/amazon-login
            Method: GET
        PwaServiceWorker:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /service-worker.js
            Method: GET
        PwaManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /manifest.json
            Method: GET
        CalendarCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /api/calendar/callback
            Method: GET
      Tags:
        Project: auto-reward-service
        Stage: prod

  # ─────────────────────────────────────────
  # CloudWatch Logs（Unit 7）
  # ─────────────────────────────────────────
  LiffApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LiffApiFunction}"
      RetentionInDays: 30

Outputs:
  ArsTableName:
    Description: DynamoDB table name
    Value: !Ref ArsTable
  ArsTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt ArsTable.Arn
  ReceiptProcessingQueueArn:
    Description: Receipt Processing SQS Queue ARN
    Value: !GetAtt ReceiptProcessingQueue.Arn
  ArsCommonLayerArn:
    Description: Lambda Layer ARN
    Value: !Ref ArsCommonLayer
  ArsLambdaRoleArn:
    Description: Lambda execution role ARN
    Value: !GetAtt ArsLambdaRole.Arn
  WebhookApiEndpoint:
    Description: LINE Webhook URL (POST /webhook)
    Value: !Join
      - ""
      - - !GetAtt WebhookApi.ApiEndpoint
        - "/webhook"
  RewardPoolUpdaterFunctionArn:
    Description: Reward pool batch updater Lambda ARN
    Value: !GetAtt RewardPoolUpdaterFunction.Arn
  LiffApiEndpoint:
    Description: LIFF Dashboard URL
    Value: !Join
      - ""
      - - !GetAtt WebhookApi.ApiEndpoint
        - "/liff"
  LiffApiFunctionArn:
    Description: LIFF API Lambda ARN
    Value: !GetAtt LiffApiFunction.Arn
  PwaTemptationFunctionArn:
    Description: PWA Temptation API Lambda ARN
    Value: !GetAtt PwaTemptationFunction.Arn
