AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ARS Nova Act ECS Service - Amazon ログイン & カート自動化ワーカー
  ハッカソン用: Fargate + ALB + EFS でデプロイ

Parameters:
  VpcId:
    Type: String
    Default: vpc-0b8a3a0e30d59d7f3
    Description: VPC ID
  PublicSubnet1:
    Type: String
    Default: subnet-0de25ee9f4b46f2e0
    Description: Public subnet for ALB (ap-northeast-1a)
  PublicSubnet2:
    Type: String
    Default: subnet-044d09f20e78cdf8e
    Description: Public subnet for ALB (ap-northeast-1c)
  PrivateSubnet1:
    Type: String
    Default: subnet-05abb8037eca46a32
    Description: Private subnet for ECS tasks (ap-northeast-1a)
  PrivateSubnet2:
    Type: String
    Default: subnet-0dfb67c2b0be42f60
    Description: Private subnet for ECS tasks (ap-northeast-1c)
  ImageUri:
    Type: String
    Description: ECR image URI (e.g. 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/ars-nova-act:latest)
  NovaActApiKey:
    Type: String
    NoEcho: true
    Description: Nova Act API key
  LoginTokenSecret:
    Type: String
    NoEcho: true
    Default: change-me-in-production
    Description: Secret for login token signing
  ArsTableName:
    Type: String
    Default: auto-reward-service-ArsTable-OQLJOLW64DPM
    Description: DynamoDB ArsTable name

Resources:

  # ─────────────────────────────────────────
  # ECS Cluster
  # ─────────────────────────────────────────
  ArsEcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: ars-nova-act
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 1

  # ─────────────────────────────────────────
  # EFS (プロファイル永続化)
  # ─────────────────────────────────────────
  ProfileFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: ars-nova-act-profiles

  EfsMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ProfileFileSystem
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups:
        - !Ref EfsSecurityGroup

  EfsMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ProfileFileSystem
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref EfsSecurityGroup

  EfsAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref ProfileFileSystem
      PosixUser:
        Uid: "1000"
        Gid: "1000"
      RootDirectory:
        Path: /profiles
        CreationInfo:
          OwnerUid: "1000"
          OwnerGid: "1000"
          Permissions: "755"

  # ─────────────────────────────────────────
  # Security Groups
  # ─────────────────────────────────────────
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB for ARS Nova Act login server
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: ars-nova-act-alb-sg

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks for ARS Nova Act
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: ars-nova-act-ecs-sg

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EFS mount targets for ARS profiles
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref EcsSecurityGroup
      Tags:
        - Key: Name
          Value: ars-nova-act-efs-sg

  # ─────────────────────────────────────────
  # ALB
  # ─────────────────────────────────────────
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: ars-nova-act-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: ars-nova-act-tg
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ─────────────────────────────────────────
  # IAM - ECS Task Role
  # ─────────────────────────────────────────
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ars-nova-act-task-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRPull
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: "*"

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ars-nova-act-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ArsTableName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ArsTableName}/index/*"
        - PolicyName: EFSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                Resource: !GetAtt ProfileFileSystem.Arn

  # ─────────────────────────────────────────
  # ECS Task Definition
  # ─────────────────────────────────────────
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ars-nova-act
      Cpu: "1024"
      Memory: "3072"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      Volumes:
        - Name: profiles
          EFSVolumeConfiguration:
            FilesystemId: !Ref ProfileFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref EfsAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: nova-act
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          MountPoints:
            - SourceVolume: profiles
              ContainerPath: /data/profiles
              ReadOnly: false
          Environment:
            - Name: MODE
              Value: all
            - Name: NOVA_ACT_API_KEY
              Value: !Ref NovaActApiKey
            - Name: NOVA_ACT_PROFILES_DIR
              Value: /data/profiles
            - Name: LOGIN_TOKEN_SECRET
              Value: !Ref LoginTokenSecret
            - Name: ARS_TABLE_NAME
              Value: !Ref ArsTableName
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: ENABLE_REAL_PURCHASE
              Value: "false"
            - Name: MAX_PURCHASE_AMOUNT
              Value: "1000"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: nova-act

  # ─────────────────────────────────────────
  # ECS Service
  # ─────────────────────────────────────────
  EcsService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: ars-nova-act
      Cluster: !Ref ArsEcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref EcsSecurityGroup
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
      LoadBalancers:
        - ContainerName: nova-act
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # ─────────────────────────────────────────
  # CloudWatch Logs
  # ─────────────────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/ars-nova-act
      RetentionInDays: 14

  # ─────────────────────────────────────────
  # ECR Repository
  # ─────────────────────────────────────────
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ars-nova-act
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

Outputs:
  ClusterName:
    Description: ECS Cluster name
    Value: !Ref ArsEcsCluster
  ServiceName:
    Description: ECS Service name
    Value: !GetAtt EcsService.Name
  LoadBalancerDNS:
    Description: ALB DNS name (login server URL)
    Value: !Sub "http://${LoadBalancer.DNSName}"
  EcrRepositoryUri:
    Description: ECR repository URI
    Value: !GetAtt EcrRepository.RepositoryUri
  EfsFileSystemId:
    Description: EFS file system ID
    Value: !Ref ProfileFileSystem
  LoginUrl:
    Description: Amazon login page URL template
    Value: !Sub "http://${LoadBalancer.DNSName}/login/{user_id}"
